spring:
  application:
    name: argus-service
  config:
    import:
    - classpath:application-local.yml
  datasource:
    url: ${datasource.url}
    username: ${datasource.username}
    password: ${datasource.password}
    driver-class-name: org.postgresql.Driver

  # ──────────────────────────────────────────────
  # Spring AI — Chat（Kimi）+ Embedding（DashScope OpenAI 兼容）
  # ──────────────────────────────────────────────
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${chat.api-key}
      base-url: ${chat.base-url}
      chat:
        options:
          model: ${chat.model}
          temperature: 0.6
      embedding:
        api-key: ${embedding.api-key}
        base-url: ${embedding.base-url}
        options:
          # 指定维度，确保与数据库表结构一致
          dimensions: 512
          model: text-embedding-v3

    # PGvector 向量存储（复用已有 PostgreSQL）
    vectorstore:
      pgvector:
        dimensions: 512
        index-type: hnsw
        distance-type: cosine_distance

storage:
  minio:
    endpoint: ${minio.endpoint}
    access-key: ${minio.access-key}
    secret-key: ${minio.secret-key}
    bucket: ${minio.bucket}

rag:
  auth:
    jwt-secret: ${rag.auth.jwt-secret}
    issuer: argus-rag
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14
    refresh-cookie-name: ARGUS_DD_RAG_REFRESH_TOKEN
    refresh-cookie-secure: false
  qa:
    # 查询规划开关：true=LLM分析问题并改写/拆分，false=直接使用原问题检索
    query-planning-enabled: true
    # ── 重排序器配置 ──
    reranker:
      # 是否启用 LLM 重排序（当前因 API 限流和延迟问题关闭）
      enabled: false

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # 控制业务侧每次调用 VectorStore.add 的 chunk 数量，降低单次 Ollama embedding 请求压力。
    add-batch-size: 9